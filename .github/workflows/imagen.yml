name: Imagen del contenedor

# Construye la imagen de la herramienta en cronos (runner propio del clúster, issue #4),
# pasa los tests dentro de la imagen y la sube al registro privado Zot de cronos.
# La usan los CronJobs de ingesta como localhost:5000/dinero-publico/datos.
on:
  push:
    branches: [main]
    paths: ["dinero_datos/**", "tests/**", "contenedor/**", "requirements*.txt", "Dockerfile", ".dockerignore", ".github/workflows/imagen.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: imagen
  cancel-in-progress: true

jobs:
  imagen:
    runs-on: cronos
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # El runner trae las credenciales de Zot en un volumen de solo lectura; buildx necesita
      # una carpeta de configuración donde pueda escribir.
      - name: Credenciales del registro
        run: |
          mkdir -p "$RUNNER_TEMP/docker"
          cp "$ZOT_DOCKER_CONFIG" "$RUNNER_TEMP/docker/config.json"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: ${{ env.BUILDKIT_HOST }}

      - name: Tests dentro de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          target: pruebas
          platforms: linux/amd64
          outputs: type=cacheonly

      - name: Publicar en Zot
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: VERSION=${{ github.sha }}
          tags: |
            ${{ env.REGISTRO }}/dinero-publico/datos:latest
            ${{ env.REGISTRO }}/dinero-publico/datos:${{ github.sha }}
