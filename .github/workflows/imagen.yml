name: Imagen del contenedor

# Construye la imagen de la herramienta y la publica en ghcr.io/dinero-publico/datos.
# La usan los CronJobs de k3s en cronos (issue #4). Solo amd64, que es lo que tiene cronos.
on:
  push:
    branches: [main]
    paths: ["dinero_datos/**", "sql/**", "tests/**", "requirements*.txt", "Dockerfile", ".dockerignore", ".github/workflows/imagen.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: imagen
  cancel-in-progress: true

jobs:
  imagen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: dinero-datos:prueba
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tests dentro de la imagen
        run: docker run --rm --entrypoint python dinero-datos:prueba -m pytest -q -p no:cacheprovider

      - name: Publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ github.sha }}
          tags: |
            ghcr.io/dinero-publico/datos:latest
            ghcr.io/dinero-publico/datos:${{ github.sha }}
          cache-from: type=gha
